name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # necesario para OIDC con AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Credenciales AWS (OIDC, sin access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Los assets de /_astro llevan hash en el nombre: se pueden cachear 1 año.
      - name: Subir assets con caché largo
        run: |
          aws s3 sync dist/_astro "s3://${{ vars.S3_BUCKET }}/_astro" \
            --delete --cache-control "public,max-age=31536000,immutable"

      # El HTML y el resto se revalidan siempre, para que los cambios se vean al instante.
      - name: Subir HTML y demás archivos
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" \
            --delete --exclude "_astro/*" --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidar caché de CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
